[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ai-project-memory"
dynamic = ["version"]
description = "Shared, local, plain-Markdown memory for AI coding agents: Claude Code, Cursor, Antigravity/Gemini and Codex read and write the same notes."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "falconsw" }]
keywords = ["ai-agents", "claude-code", "cursor", "codex", "gemini", "antigravity", "memory", "handoff", "context-engineering", "hooks"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development",
]

[project.scripts]
project-memory = "project_memory:main"
# Same command under the package name, so `uvx ai-project-memory install` works without --from.
ai-project-memory = "project_memory:main"

[project.urls]
Homepage = "https://github.com/falconsw/project-memory"
Repository = "https://github.com/falconsw/project-memory"
Issues = "https://github.com/falconsw/project-memory/issues"
Changelog = "https://github.com/falconsw/project-memory/blob/main/CHANGELOG.md"

# One version for the clone, the store copy and the wheel.
[tool.hatch.version]
path = "bin/aimem_common.py"

# The repo layout stays as it is (hooks and README point at bin/); the wheel mirrors it under
# project_memory/, so install.py finds templates/ next to its bin/ exactly as in a clone.
[tool.hatch.build.targets.wheel]
packages = ["src/project_memory"]
exclude = ["__pycache__", "*.pyc"]

[tool.hatch.build.targets.wheel.force-include]
"bin" = "project_memory/bin"
"templates" = "project_memory/templates"
"integrations" = "project_memory/integrations"
"PROTOCOL.md" = "project_memory/PROTOCOL.md"
"GLOBAL-RULE.md" = "project_memory/GLOBAL-RULE.md"

[tool.hatch.build.targets.sdist]
include = ["/bin", "/src", "/templates", "/integrations", "/tests", "/PROTOCOL.md", "/GLOBAL-RULE.md", "/README.md", "/CHANGELOG.md", "/LICENSE"]
exclude = ["__pycache__", "*.pyc"]
